name: UI CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test-build:
    name: Lint, format, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (oxlint, ESLint-compatible rules)
        run: npm run lint

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: dist
